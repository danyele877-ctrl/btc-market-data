
name: Update BTC Market Data

on:
  push:
    branches: [main]
    paths:
      - "collector.py"
      - "quality_check.py"
      - "candle_service.py"
      - "requirements.txt"
      - ".github/workflows/update-data.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: btc-market-data-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run collector
        run: python collector.py

      - name: Validate source freshness and payloads
        run: python quality_check.py

      - name: Save market data
        run: |
          set -e
          cp data/latest.json /tmp/btc-latest.json
          cp data/quality.json /tmp/btc-quality.json

          # Rebase-free publication: always build the data commit on the newest main.
          # Retry if another scheduled run pushes between fetch and push.
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            cp /tmp/btc-latest.json data/latest.json
            cp /tmp/btc-quality.json data/quality.json

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/latest.json data/quality.json
            if git diff --cached --quiet; then
              echo "No data changes to publish."
              exit 0
            fi
            git commit -m "Update BTC market data"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; refreshing main and retrying."
            sleep 2
          done

          echo "Unable to publish market data after 3 attempts."
          exit 1
