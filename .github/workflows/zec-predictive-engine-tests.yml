name: ZEC Predictive Engine Tests

on:
  push:
    paths:
      - "zec_predictive_engine.py"
      - "zec_early_signal.py"
      - "zec_shadow_signal.py"
      - "zec_prediction_tracking.py"
      - "analyze_zec_prediction_tracking.py"
      - "analyze_zec_directional_bias.py"
      - "walk_forward_zec_validation.py"
      - "zec_context_archive.py"
      - "zec_queue_model.py"
      - "candle_service.py"
      - "capture_render_feed.py"
      - "replay_zec_signals.py"
      - "build_radar_snapshot.py"
      - "radar_alert_contract.py"
      - "docs/**"
      - "CHANGELOG_RADAR.md"
      - "README.md"
      - "tests/**"
      - ".github/workflows/zec-predictive-engine-tests.yml"
  pull_request:
    paths:
      - "zec_predictive_engine.py"
      - "zec_early_signal.py"
      - "capture_render_feed.py"
      - "zec_queue_model.py"
      - "zec_context_archive.py"
      - "zec_prediction_tracking.py"
      - "zec_shadow_signal.py"
      - "analyze_zec_prediction_tracking.py"
      - "analyze_zec_directional_bias.py"
      - "build_radar_snapshot.py"
      - "radar_alert_contract.py"
      - "docs/**"
      - "CHANGELOG_RADAR.md"
      - "README.md"
      - "tests/**"
      - ".github/workflows/zec-predictive-engine-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate published Radar alert contract
        run: python radar_alert_contract.py data/radar_snapshot.json

      - name: Print paired LONG SHORT archive diagnostics
        run: python analyze_zec_directional_bias.py --archive data/zec_predictive_archive.json

      - name: Run BASELINE SHADOW tracking diagnostics when archive exists
        run: |
          if [ -f data/zec_prediction_tracking.json ]; then
            python analyze_zec_prediction_tracking.py --archive data/zec_prediction_tracking.json
          else
            echo "Prediction tracking archive not initialized yet; analyzer unit tests still run."
          fi

      - name: Run historical walk-forward diagnostic
        run: |
          python walk_forward_zec_validation.py --archive data/zec_predictive_archive.json > /tmp/zec_walk_forward.json
          python -c 'import json; r=json.load(open("/tmp/zec_walk_forward.json")); print(json.dumps({"folds":r["folds"],"results":{k:{"scored":v["scored"],"brier_score":v["brier_score"],"coverage":v["coverage"]} for k,v in r["results"].items()}},indent=2))'
