name: ZEC Predictive Engine Tests

on:
  push:
    paths:
      - "zec_predictive_engine.py"
      - "zec_early_signal.py"
      - "analyze_zec_directional_bias.py"
      - "zec_context_archive.py"
      - "zec_queue_model.py"
      - "candle_service.py"
      - "capture_render_feed.py"
      - "replay_zec_signals.py"
      - "build_radar_snapshot.py"
      - "tests/**"
      - ".github/workflows/zec-predictive-engine-tests.yml"
  pull_request:
    paths:
      - "zec_predictive_engine.py"
      - "zec_early_signal.py"
      - "analyze_zec_directional_bias.py"
      - "build_radar_snapshot.py"
      - "tests/**"
      - ".github/workflows/zec-predictive-engine-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Print paired LONG SHORT archive diagnostics
        run: python analyze_zec_directional_bias.py --archive data/zec_predictive_archive.json
