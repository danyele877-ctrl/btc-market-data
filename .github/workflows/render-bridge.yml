name: Render Candle Feed Bridge
# Push-triggered refresh is the immediate recovery path when the scheduled 5-minute
# bridge has not published a fresh snapshot. It runs the same validation/capture path.

on:
  push:
    branches: [main]
    paths:
      - "capture_render_feed.py"
      - "build_radar_snapshot.py"
      - "zec_early_signal.py"
      - "zec_predictive_engine.py"
      - "zec_queue_model.py"
      - "zec_context_archive.py"
      - "zec_prediction_tracking.py"
      - "analyze_zec_prediction_tracking.py"
      - "zec_contract_config.py"
      - "render_bridge_publication.py"
      - "replay_zec_signals.py"
      - "candle_service.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/render-bridge.yml"
  workflow_dispatch:
  repository_dispatch:
    types: [refresh_render_feed]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  # Let an active capture finish: the service dispatches refreshes frequently,
  # and cancelling in-progress jobs prevents the feed from ever being published.
  # GitHub retains only the newest pending run for this concurrency group.
  group: render-candle-feed-bridge
  cancel-in-progress: false

jobs:
  publish-render-feed:
    runs-on: ubuntu-latest
    # Capture performs several independent public API reads and paginated
    # history requests; leave enough time for bounded per-request timeouts.
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install service dependencies
        run: python -m pip install -r requirements.txt

      # Full historical backfill is a maintenance action; ordinary candle refreshes
      # append incrementally through build_radar_snapshot.py and must stay fast.
      - name: Replay recent ZEC signal snapshots
        if: github.event_name == 'workflow_dispatch'
        run: python replay_zec_signals.py --limit 600

      - name: Capture Render health and completed candles
        run: python capture_render_feed.py

      - name: Validate feed before building or publishing
        run: python capture_render_feed.py --validate-existing

      - name: Build compact radar snapshot
        run: python build_radar_snapshot.py

      - name: Analyze BASELINE and SHADOW prediction tracking
        run: python analyze_zec_prediction_tracking.py --archive data/zec_prediction_tracking.json

      - name: Publish only the Render bridge snapshot
        run: |
          set -e
          cp data/render_feed.json /tmp/render-feed.json
          cp data/zec_microstructure_history.json /tmp/zec-microstructure-history.json
          cp data/zec_xperp_history.json /tmp/zec-xperp-history.json
          cp data/radar_snapshot.json /tmp/radar-snapshot.json
          cp data/zec_prediction_tracking.json /tmp/zec-prediction-tracking.json
          cp data/zec_predictive_archive.json /tmp/zec-predictive-archive.json
          cp data/zec_context_archive.json /tmp/zec-context-archive.json
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            set +e
            python render_bridge_publication.py \
              --candidate-feed /tmp/render-feed.json \
              --candidate-snapshot /tmp/radar-snapshot.json \
              --published-feed data/render_feed.json \
              --published-snapshot data/radar_snapshot.json
            decision=$?
            set -e
            if [ "$decision" -eq 10 ]; then
              echo "Skipping stale Render bridge candidate."
              exit 0
            fi
            if [ "$decision" -ne 0 ]; then
              exit "$decision"
            fi
            cp /tmp/render-feed.json data/render_feed.json
            cp /tmp/zec-microstructure-history.json data/zec_microstructure_history.json
            cp /tmp/zec-xperp-history.json data/zec_xperp_history.json
            cp /tmp/radar-snapshot.json data/radar_snapshot.json
            cp /tmp/zec-prediction-tracking.json data/zec_prediction_tracking.json
            cp /tmp/zec-predictive-archive.json data/zec_predictive_archive.json
            cp /tmp/zec-context-archive.json data/zec_context_archive.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/render_feed.json data/zec_microstructure_history.json data/zec_xperp_history.json data/radar_snapshot.json data/zec_prediction_tracking.json data/zec_predictive_archive.json data/zec_context_archive.json
            if git diff --cached --quiet; then
              echo "Render bridge snapshot unchanged."
              exit 0
            fi
            git commit -m "Refresh Render candle feed bridge"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; refreshing branch."
            sleep 2
          done
          echo "Unable to publish Render bridge after 3 attempts."
          exit 1
