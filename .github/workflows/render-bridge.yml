name: Render Candle Feed Bridge
# Manual push probe also verifies Render health and publishes a compact snapshot.

on:
  push:
    branches: [main]
    paths:
      - "capture_render_feed.py"
      - "build_radar_snapshot.py"
      - "candle_service.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/render-bridge.yml"
  workflow_dispatch:
  repository_dispatch:
    types: [refresh_render_feed]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  # Keep deployment/test runs separate from the high-frequency refresh bridge.
  # Otherwise a repository_dispatch arriving during a push can cancel the deploy.
  group: render-candle-feed-bridge-${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'deploy' || 'refresh' }}
  cancel-in-progress: true

jobs:
  publish-render-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install service dependencies
        run: python -m pip install -r requirements.txt

      - name: Run service regression tests
        run: python -m unittest discover -s tests -v

      - name: Capture Render health and completed candles
        run: python capture_render_feed.py

      - name: Build compact radar snapshot
        run: python build_radar_snapshot.py

      - name: Publish only the Render bridge snapshot
        run: |
          set -e
          cp data/render_feed.json /tmp/render-feed.json
          cp data/zec_microstructure_history.json /tmp/zec-microstructure-history.json
          cp data/zec_xperp_history.json /tmp/zec-xperp-history.json
          cp data/radar_snapshot.json /tmp/radar-snapshot.json
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            cp /tmp/render-feed.json data/render_feed.json
            cp /tmp/zec-microstructure-history.json data/zec_microstructure_history.json
            cp /tmp/zec-xperp-history.json data/zec_xperp_history.json
            cp /tmp/radar-snapshot.json data/radar_snapshot.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/render_feed.json data/zec_microstructure_history.json data/zec_xperp_history.json data/radar_snapshot.json
            if git diff --cached --quiet; then
              echo "Render bridge snapshot unchanged."
              exit 0
            fi
            git commit -m "Refresh Render candle feed bridge"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; refreshing branch."
            sleep 2
          done
          echo "Unable to publish Render bridge after 3 attempts."
          exit 1
