name: Render Candle Feed Bridge
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  websocket-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public OKX EEA order book and trades
        run: |
          node --input-type=module <<'JS'
          const instrument = 'ZEC-USD_UM_XPERP-310530';
          const channels = ['books', 'trades'];
          const ws = new WebSocket('wss://wseea.okx.com/ws/v5/public');
          const subscribed = new Set();
          const count = {books: 0, trades: 0};
          function finish(code, reason) {
            console.log(JSON.stringify({instrument, subscribed: [...subscribed], count, reason}));
            process.exit(code);
          }
          setTimeout(() => finish(1, 'Timed out waiting for subscriptions and data'), 45000);
          ws.addEventListener('open', () => {
            ws.send(JSON.stringify({op: 'subscribe', args: channels.map(channel => ({channel, instId: instrument}))}));
          });
          ws.addEventListener('error', event => finish(1, String(event.message || 'WebSocket handshake or transport failed')));
          ws.addEventListener('close', event => finish(1, 'WebSocket closed: ' + event.code));
          ws.addEventListener('message', event => {
            if (event.data === 'pong') return;
            const message = JSON.parse(event.data);
            if (message.event === 'error') return finish(1, String(message.code) + ': ' + message.msg);
            const {channel, instId} = message.arg || {};
            if (instId !== instrument || !channels.includes(channel)) return;
            if (message.event === 'subscribe') subscribed.add(channel);
            if (Array.isArray(message.data)) count[channel] += message.data.length;
            if (subscribed.size === channels.length && channels.every(item => count[item] > 0)) {
              finish(0, 'Exact contract received on both public channels');
            }
          });
          setInterval(() => { if (ws.readyState === WebSocket.OPEN) ws.send('ping'); }, 15000);
          JS
