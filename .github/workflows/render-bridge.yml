name: Render Candle Feed Bridge
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  websocket-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run existing regression suite
        run: python -m unittest discover -s tests
      - name: Validate a live five-minute window using the existing collector
        run: |
          python -u - <<'PY'
          import asyncio
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from candle_service import CandleFeed

          async def main():
              with TemporaryDirectory() as directory:
                  feed = CandleFeed(Path(directory) / 'candles.json')
                  collector = asyncio.create_task(feed.run_microstructure_websocket())
                  try:
                      for _ in range(64):
                          await asyncio.sleep(5)
                          health = feed.microstructure_health()
                          cvd = health['cvd']
                          keys = ('status', 'last_error', 'connected', 'book_valid', 'book_gap_count', 'trade_gap_count', 'message_age_seconds', 'book_age_seconds', 'trade_age_seconds')
                          ready = (
                              health['connected'] and health['book_valid']
                              and (health.get('book_gap_count') or 0) == 0
                              and cvd['ready_1m'] and cvd['ready_5m']
                              and (cvd.get('trade_count_5m') or 0) > 0
                              and all(health.get(key) is not None and 0 <= health[key] <= limit
                                      for key, limit in [('message_age_seconds', 120), ('book_age_seconds', 180), ('trade_age_seconds', 180)])
                          )
                          if ready or _ % 6 == 0 or _ == 63:
                              print(json.dumps({'at': datetime.now(timezone.utc).isoformat(), **{key: health.get(key) for key in keys}, 'cvd': cvd, 'ready': ready}))
                          if ready:
                              return
                      raise SystemExit('No valid five-minute window within the test budget')
                  finally:
                      collector.cancel()
                      await asyncio.gather(collector, return_exceptions=True)

          asyncio.run(main())
          PY
