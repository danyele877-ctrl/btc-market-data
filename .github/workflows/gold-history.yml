name: Gold Historical Backfill
on:
  push:
    branches: [gold-radar]
    paths: ['.github/workflows/gold-history.yml', 'gold_history.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backfill:
    if: github.ref == 'refs/heads/gold-radar'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Validate syntax and pagination with synthetic candles
        run: |
          python -m py_compile gold_history.py
          python - <<'PY'
          from gold_history import collect
          now=600000
          def row(t, confirmed="1"):
              return [str(t),"10","12","9","11","1","1","1",confirmed]
          def fetch(path, **params):
              if "after" not in params:
                  return [row(600000,"0"),row(540000),row(480000)]
              if params["after"]=="480000":
                  return [row(480000),row(360000)]
              return []
          result=collect("1m",1,fetch=fetch,now=now)
          assert result["count"]==3
          assert result["missing_intervals"]==1
          assert result["pagination_finished"]
          PY
      - name: Collect public historical data
        run: python gold_history.py
      - uses: actions/upload-artifact@v4
        with:
          name: gold-history
          path: gold-history.json
          retention-days: 7
