name: Gold Calendar Unified
on:
  push:
    branches: [gold-radar]
    paths: ['gold_calendar*.py', '.github/workflows/gold-calendar-unified.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.13.4
      - run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from gold_calendar_unified import normalize
          now=datetime(2026,11,25,tzinfo=timezone.utc)
          fed='<div class="panel"><div class="panel-heading">2026 FOMC Meetings</div><div class="fomc-meeting"><div class="fomc-meeting__month">December</div><div class="fomc-meeting__date">8-9*</div></div></div>'
          bea='<table><tr class="scheduled-releases-type-press"><td class="release-title">Personal Income and Outlays</td><td class="release-date">November 25</td><td class="scheduled-date"><small>8:30 AM</small></td></tr></table>'
          out=normalize({"FED":{"http_status":200,"source_html":fed},"BEA":{"http_status":200,"source_html":bea}},now,{"status":"RESEARCH_ONLY","events":[{"kind":"CPI","scheduled_at":"2026-11-26T13:30:00+00:00"}]})
          assert len(out["events"])==3
          assert out["events"][0]["date"]=="2026-12-09"
          assert out["events"][0]["projections"]
          assert out["events"][1]["scheduled_at"] is None
          assert out["events"][2]["source"]=="BLS"
          assert not out["notifications_enabled"]
          assert not normalize({},now)["events"]
          PY
      - run: |
          python gold_calendar_sources.py > gold-calendar-sources.json
          python gold_calendar_unified.py gold-calendar-sources.json > gold-calendar-unified.json
      - uses: actions/upload-artifact@v4
        with:
          name: gold-calendar-unified
          path: |
            gold-calendar-unified.json
            gold-calendar-sources.json
          retention-days: 7
